name: Build Midnight

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Debug or Release'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine build type
        id: config
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "variant=GoogleRelease" >> $GITHUB_OUTPUT
            echo "build_type=release" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            BT="${{ github.event.inputs.build_type }}"
            CAP="${BT^}"
            echo "variant=Google$CAP" >> $GITHUB_OUTPUT
            echo "build_type=$BT" >> $GITHUB_OUTPUT
            if [ "$BT" = "release" ]; then
              echo "is_release=true" >> $GITHUB_OUTPUT
            else
              echo "is_release=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Decode release keystore
        if: steps.config.outputs.is_release == 'true'
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > $GITHUB_WORKSPACE/release.keystore

      - name: Build
        run: |
          ./gradlew assemble${{ steps.config.outputs.variant }} --build-cache --parallel

      - name: Collect APKs
        run: |
          mkdir -p /tmp/apks
          find app/build/outputs/apk -name "*.apk" -exec cp {} /tmp/apks/ \;
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: APK size report
        run: |
          for apk in app/build/outputs/apk/google/release/*.apk; do
            echo "::group::$(basename "$apk")"
            ls -lh "$apk" | awk '{print "apk total: " $5}'
            echo "--- uncompressed size by area ---"
            unzip -l "$apk" | awk 'NF>3 && $1 ~ /^[0-9]+$/ {
              n=$NF
              if (n ~ /^classes[0-9]*\.dex$/) k="dex (app code)"
              else if (n ~ /^lib\//) k="lib (native code)"
              else if (n ~ /^res\//) k="res (fonts/images/layouts)"
              else if (n ~ /^assets\//) k="assets"
              else k="other"
              t[k]+=$1
            } END { for (k in t) printf "%10.1f MB  %s\n", t[k]/1048576, k }' | sort -rn
            echo "--- dex files ---"
            unzip -l "$apk" | awk '$NF ~ /^classes[0-9]*\.dex$/ {printf "%8.2f MB  %s\n", $1/1048576, $NF}' | sort -rn
            echo "--- native libs ---"
            unzip -l "$apk" | awk '$NF ~ /^lib\// {printf "%8.2f MB  %s\n", $1/1048576, $NF}' | sort -rn
            echo "--- fonts actually packaged ---"
            unzip -l "$apk" | awk '$NF ~ /^res\/.*\.(ttf|otf|ttc)$/ {printf "%8.1f KB  %s\n", $1/1024, $NF}' | sort -rn
            echo "--- 20 largest res entries ---"
            unzip -l "$apk" | awk '$NF ~ /^res\// {printf "%8.1f KB  %s\n", $1/1024, $NF}' | sort -rn | head -20
            echo "::endgroup::"
          done

      - name: Verify plugin API survived R8
        run: |
          MAPPING=$(find app/build/outputs/mapping -name mapping.txt | head -1)
          if [ -z "$MAPPING" ]; then
            echo "::warning::no mapping.txt found, skipping rename check"
            exit 0
          fi
          echo "using $MAPPING"
          echo "--- plugin-facing classes R8 renamed (kept classes map to themselves) ---"
          OBF=$(awk '/^(com\.lagradost\.cloudstream3\.(MainAPI|ExtractorApi|plugin\.|syncproviders\.|utils\.)|com\.google\.firebase\.crashlytics|eu\.kanade\.tachiyomi\.source\.api|ani\.sanin\.others\.CrashActivity)[A-Za-z0-9_.$]* -> / { o=$1; r=$3; sub(/:$/,"",r); if (o != r) print o" -> "r }' "$MAPPING")
          if [ -n "$OBF" ]; then
            echo "$OBF" | head -30
            echo "::error::$(echo "$OBF" | wc -l) plugin-facing classes were renamed by R8 - plugins would crash"
            exit 1
          fi
          echo "OK: no plugin-facing class was renamed"
          echo "--- total classes R8 renamed ---"
          awk '{ o=$1; r=$3; sub(/:$/,"",r); if (o != r) n++ } END { print n+0 }' "$MAPPING"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.config.outputs.build_type }}
          path: /tmp/apks/*.apk

      - name: Generate tag and release notes
        if: steps.config.outputs.is_release == 'true'
        id: release
        run: |
          LATEST_TAG=$(git tag --list '0.*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="0.2.5"
          else
            PATCH=$(echo "$LATEST_TAG" | sed 's/^0\.2\.\([0-9]*\)$/\1/')
            if [ "$PATCH" = "$LATEST_TAG" ]; then
              NEW_TAG="0.2.5"
            else
              NEW_TAG="0.2.$((PATCH + 1))"
            fi
          fi
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

          if [ -z "$LATEST_TAG" ]; then
            RANGE="HEAD~10..HEAD"
          else
            RANGE="${LATEST_TAG}..HEAD"
          fi

          NOTES="# v$NEW_TAG"
          while IFS= read -r line; do
            SHA=$(echo "$line" | awk '{print $1}')
            MSG=$(echo "$line" | cut -d' ' -f2-)
            NOTES="$NOTES"$'\n\n'"### ${SHA} — ${MSG}"
            BODY=$(git log --format="%b" -1 "$SHA" | tr '\n' ' ' | sed 's/  */ /g' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            if [ -n "$BODY" ]; then
              NOTES="$NOTES"$'\n'"$BODY"
            else
              NOTES="$NOTES"$'\n'"${MSG}"
            fi
          done <<< "$(git log "$RANGE" --oneline --reverse)"

          echo "$NOTES" > /tmp/release_notes.md

      - name: Create Release
        if: steps.config.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.new_tag }}
          name: "v${{ steps.release.outputs.new_tag }}"
          body_path: /tmp/release_notes.md
          files: /tmp/apks/*.apk
          generate_release_notes: false
          make_latest: true
