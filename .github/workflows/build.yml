name: Build Midnight

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Debug or Release'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine build type
        id: config
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "variant=GoogleRelease" >> $GITHUB_OUTPUT
            echo "build_type=release" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            BT="${{ github.event.inputs.build_type }}"
            CAP="${BT^}"
            echo "variant=Google$CAP" >> $GITHUB_OUTPUT
            echo "build_type=$BT" >> $GITHUB_OUTPUT
            if [ "$BT" = "release" ]; then
              echo "is_release=true" >> $GITHUB_OUTPUT
            else
              echo "is_release=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Decode release keystore
        if: steps.config.outputs.is_release == 'true'
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > $GITHUB_WORKSPACE/release.keystore

      - name: Build
        run: |
          ./gradlew assemble${{ steps.config.outputs.variant }} --build-cache --parallel

      - name: Collect APKs
        run: |
          mkdir -p /tmp/apks
          find app/build/outputs/apk -name "*.apk" -exec cp {} /tmp/apks/ \;
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: APK size report
        run: |
          mapfile -t APKS < <(find app/build/outputs/apk -name "*.apk" 2>/dev/null | sort)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "::warning::no APK found to report on"
            exit 0
          fi
          for apk in "${APKS[@]}"; do
            echo "::group::$(basename "$apk")"
            ls -lh "$apk" | awk '{print "apk total: " $5}'
            echo "--- uncompressed size by area ---"
            unzip -l "$apk" | awk 'NF>3 && $1 ~ /^[0-9]+$/ {
              n=$NF
              if (n ~ /^classes[0-9]*\.dex$/) k="dex (app code)"
              else if (n ~ /^lib\//) k="lib (native code)"
              else if (n ~ /^res\//) k="res (fonts/images/layouts)"
              else if (n ~ /^assets\//) k="assets"
              else k="other"
              t[k]+=$1
            } END { for (k in t) printf "%10.1f MB  %s\n", t[k]/1048576, k }' | sort -rn
            echo "--- dex files ---"
            unzip -l "$apk" | awk '$NF ~ /^classes[0-9]*\.dex$/ {printf "%8.2f MB  %s\n", $1/1048576, $NF}' | sort -rn
            echo "--- native libs ---"
            unzip -l "$apk" | awk '$NF ~ /^lib\// {printf "%8.2f MB  %s\n", $1/1048576, $NF}' | sort -rn
            echo "--- fonts actually packaged ---"
            unzip -l "$apk" | awk '$NF ~ /^res\/.*\.(ttf|otf|ttc)$/ {printf "%8.1f KB  %s\n", $1/1024, $NF}' | sort -rn
            echo "--- 20 largest res entries ---"
            unzip -l "$apk" | awk '$NF ~ /^res\// {printf "%8.1f KB  %s\n", $1/1024, $NF}' | sort -rn | head -20
            echo "::endgroup::"
          done

      - name: Verify plugin API survived R8
        run: |
          MAPPING=$(find app/build/outputs/mapping -name mapping.txt | head -1)
          if [ -z "$MAPPING" ]; then
            echo "::warning::no mapping.txt found, skipping rename check"
            exit 0
          fi
          echo "using $MAPPING"
          # Compiler-generated holders (lambda wrappers, suspend continuations) and
          # classes R8 merged away are internal to a single dex, never linked to by
          # name from outside, so their names do not have to be stable. The pattern is
          # an awk regex literal rather than a -v value, because how an awk handles
          # backslash escapes in a -v value is not the same everywhere.
                    echo "--- classes R8 renamed, grouped by package ---"
          awk '/^[^#[:space:]]/ { o=$1; r=$3; sub(/:$/,"",r)
                if (o != r && o !~ /\$\$ExternalSynthetic|\$-CC|R8\$\$REMOVED\$\$CLASS\$\$/) {
                p=o; sub(/\.[A-Z][A-Za-z0-9_$]*$/,"",p); n[p]++ }
              } END { for (k in n) printf "%6d  %s\n", n[k], k }' "$MAPPING" | sort -rn | head -25
          echo "--- total classes R8 renamed ---"
          awk '/^[^#[:space:]]/ { o=$1; r=$3; sub(/:$/,"",r); if (o != r && o !~ /\$\$ExternalSynthetic|\$-CC|R8\$\$REMOVED\$\$CLASS\$\$/) n++ } END { print n+0 }' "$MAPPING"
          echo "--- API that plugins and extensions link against ---"
          FAILED=0
          # Every class name in these packages is part of an external ABI, nested
          # classes and compiler-generated ones included, because a plugin is a
          # separate dex file that links to those names.
          for prefix in "com.lagradost" "eu.kanade" "tachiyomi"; do
            renamed=$(awk -v p="$prefix" '/^[^[:space:]]/ && index($1, p) == 1 && / -> / {
                o=$1; r=$3; sub(/:$/,"",r)
                if (o ~ /\$\$ExternalSynthetic|\$-CC|R8\$\$REMOVED\$\$CLASS\$\$/) next
                if (o != r) print o" -> "r }' "$MAPPING" | head -5)
            if [ -n "$renamed" ]; then
              echo "::error::R8 renamed classes under $prefix - plugins or extensions would crash:"
              echo "$renamed"
              FAILED=1
            else
              echo "ok: $prefix"
            fi
          done
          # App classes that Android looks up by name. Only the top-level name
          # matters here: nothing outside the app refers to their nested or
          # lambda classes, so those stay free to shrink and rename.
          for name in \
            "ani.sanin.FadingEdgeRecyclerView" \
            "ani.sanin.NoGestureSubsamplingImageView" \
            "ani.sanin.SpinnerNoSwipe" \
            "ani.sanin.home.status.CircleView" \
            "ani.sanin.home.status.Stories" \
            "ani.sanin.others.CrashActivity" \
            "ani.sanin.others.Xpandable" \
            "ani.sanin.others.Xubtitle" \
            "ani.sanin.ui.components.SnakeNavRailView" \
          ; do
            if ! grep -q "^$name -> $name:" "$MAPPING"; then
              echo "::error::$name was renamed or stripped; Android looks this class up by name"
              FAILED=1
            fi
          done
          # Present at all, which the prefix scan above cannot tell: a class that
          # R8 removed outright does not appear in the mapping under any name.
          for sentinel in \
            "com.lagradost.cloudstream3.MainAPI" \
            "com.lagradost.cloudstream3.MainActivityKt" \
            "com.lagradost.cloudstream3.utils.ExtractorApi" \
            "com.lagradost.cloudstream3.plugins.BasePlugin" \
            "com.lagradost.cloudstream3.syncproviders.SyncAPI" \
            "kotlin.reflect.jvm.ReflectJvmMapping" \
            "com.google.gson.Gson" \
          ; do
            if ! grep -q "^$sentinel -> " "$MAPPING"; then
              echo "::error::$sentinel is missing from the mapping - it was stripped entirely"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "OK: plugin-facing classes kept their names"
          echo "--- binary entry points prebuilt plugins link to ---"
          python3 - "$MAPPING" <<'PY'
          import re, sys
          lines = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          wanted = {"com.lagradost.cloudstream3.MainActivityKt": ["getApp", "setApp"]}
          blocks, current = {}, None
          for line in lines:
              if line[:1] not in (" ", ""):
                  m = re.match(r"^([\w.$]+) -> ([\w.$]+):?$", line)
                  current = m.group(1) if m else None
                  if m:
                      blocks[current] = {"self": m.group(1) == m.group(2), "members": {}}
              elif current and line.strip():
                  m = re.match(r"^    [\w.$\[\]<>, ]*?([\w$]+)\(.*\) -> (.*)$", line)
                  if m:
                      blocks[current]["members"][m.group(1)] = m.group(2)
          bad = []
          for cls, members in wanted.items():
              if cls not in blocks:
                  bad.append(f"{cls} missing from mapping")
                  continue
              if not blocks[cls]["self"]:
                  bad.append(f"{cls} was renamed")
              for name in members:
                  if name not in blocks[cls]["members"]:
                      bad.append(f"{cls}.{name}() was removed")
                  elif name not in blocks[cls]["members"][name]:
                      bad.append(f"{cls}.{name}() was renamed to {blocks[cls]['members'][name]}")
          if bad:
              print("::error::plugin entry points are not intact: " + "; ".join(bad))
              sys.exit(1)
          print("ok: " + ", ".join(f"{c}.{m}()" for c, ms in wanted.items() for m in ms))
          PY
          echo "OK: plugin-facing API kept its names"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.config.outputs.build_type }}
          path: /tmp/apks/*.apk

      - name: Generate tag and release notes
        if: steps.config.outputs.is_release == 'true'
        id: release
        run: |
          LATEST_TAG=$(git tag --list '0.*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="0.2.5"
          else
            PATCH=$(echo "$LATEST_TAG" | sed 's/^0\.2\.\([0-9]*\)$/\1/')
            if [ "$PATCH" = "$LATEST_TAG" ]; then
              NEW_TAG="0.2.5"
            else
              NEW_TAG="0.2.$((PATCH + 1))"
            fi
          fi
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

          if [ -z "$LATEST_TAG" ]; then
            RANGE="HEAD~10..HEAD"
          else
            RANGE="${LATEST_TAG}..HEAD"
          fi

          NOTES="# v$NEW_TAG"
          while IFS= read -r line; do
            SHA=$(echo "$line" | awk '{print $1}')
            MSG=$(echo "$line" | cut -d' ' -f2-)
            NOTES="$NOTES"$'\n\n'"### ${SHA} — ${MSG}"
            BODY=$(git log --format="%b" -1 "$SHA" | tr '\n' ' ' | sed 's/  */ /g' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            if [ -n "$BODY" ]; then
              NOTES="$NOTES"$'\n'"$BODY"
            else
              NOTES="$NOTES"$'\n'"${MSG}"
            fi
          done <<< "$(git log "$RANGE" --oneline --reverse)"

          echo "$NOTES" > /tmp/release_notes.md

      - name: Create Release
        if: steps.config.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.new_tag }}
          name: "v${{ steps.release.outputs.new_tag }}"
          body_path: /tmp/release_notes.md
          files: /tmp/apks/*.apk
          generate_release_notes: false
          make_latest: true
