name: Build Midnight

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Debug or Release'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      cap: ${{ steps.config.outputs.cap }}
      build_type: ${{ steps.config.outputs.build_type }}
      is_release: ${{ steps.config.outputs.is_release }}
    steps:
      - name: Determine build type
        id: config
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            BT="release"
          else
            BT="${{ github.event.inputs.build_type }}"
          fi
          echo "cap=${BT^}" >> $GITHUB_OUTPUT
          echo "build_type=$BT" >> $GITHUB_OUTPUT
          if [ "$BT" = "release" ]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: [Phone, Tv]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        if: needs.detect.outputs.is_release == 'true'
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > $GITHUB_WORKSPACE/release.keystore

      - name: Build ${{ matrix.device }}
        run: ./gradlew assembleGoogle${{ matrix.device }}${{ needs.detect.outputs.cap }} --build-cache --parallel

      - name: Collect APKs
        run: |
          mkdir -p /tmp/apks
          find app/build/outputs/apk -name "*.apk" -exec cp {} /tmp/apks/ \;
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.device }}-${{ needs.detect.outputs.build_type }}
          path: /tmp/apks/*.apk

  release:
    needs: [detect, build]
    if: needs.detect.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: true
          path: /tmp/apks

      - name: List APKs
        run: ls -lh /tmp/apks

      - name: Generate tag and release notes
        id: release
        run: |
          LATEST_TAG=$(git tag --list '0.*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="0.2.5"
          else
            PATCH=$(echo "$LATEST_TAG" | sed 's/^0\.2\.\([0-9]*\)$/\1/')
            if [ "$PATCH" = "$LATEST_TAG" ]; then
              NEW_TAG="0.2.5"
            else
              NEW_TAG="0.2.$((PATCH + 1))"
            fi
          fi
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

          if [ -z "$LATEST_TAG" ]; then
            RANGE="HEAD~10..HEAD"
          else
            RANGE="${LATEST_TAG}..HEAD"
          fi

          NOTES="# v$NEW_TAG"
          while IFS= read -r line; do
            SHA=$(echo "$line" | awk '{print $1}')
            MSG=$(echo "$line" | cut -d' ' -f2-)
            NOTES="$NOTES"$'\n\n'"### ${SHA} — ${MSG}"
            BODY=$(git log --format="%b" -1 "$SHA" | tr '\n' ' ' | sed 's/  */ /g' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            if [ -n "$BODY" ]; then
              NOTES="$NOTES"$'\n'"$BODY"
            else
              NOTES="$NOTES"$'\n'"${MSG}"
            fi
          done <<< "$(git log "$RANGE" --oneline --reverse)"

          echo "$NOTES" > /tmp/release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.new_tag }}
          name: "v${{ steps.release.outputs.new_tag }}"
          body_path: /tmp/release_notes.md
          files: /tmp/apks/*.apk
          generate_release_notes: false
          make_latest: true