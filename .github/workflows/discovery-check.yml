name: Discovery Branch Build

on:
  push:
    branches:
      - feature/discovery-63-curated-categories
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [GooglePhoneDebug, GoogleTvDebug]
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable Gradle wrapper
        run: chmod +x gradlew

      - name: Build ${{ matrix.target }}
        run: ./gradlew assemble${{ matrix.target }} --build-cache --stacktrace
