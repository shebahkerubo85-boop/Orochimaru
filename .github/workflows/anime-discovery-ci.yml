name: Anime Discovery CI

on:
  push:
    branches:
      - feature/anime-discovery-categories

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Phone and TV debug variants
        run: |
          chmod +x ./gradlew
          ./gradlew assembleGooglePhoneDebug assembleGoogleTvDebug --build-cache --parallel
